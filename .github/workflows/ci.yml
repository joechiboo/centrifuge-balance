name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Platform folders are not committed yet; generate them for the build.
      - name: Generate platform folders
        run: flutter create --platforms=android,web --org com.joechiboo --project-name centrifuge_balance .
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: centrifuge-balance-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
